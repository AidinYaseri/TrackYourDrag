# Optional XcodeGen spec.
# The committed Tracky.xcodeproj works as-is; this file only exists so the
# project can be regenerated from scratch with `xcodegen generate`.
name: Tracky
options:
  bundleIdPrefix: com.tracky
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Tracky:
    type: application
    platform: iOS
    sources:
      - Tracky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tracky.Tracky
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Tracky
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIBackgroundModes: location
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Tracky uses GPS to measure your vehicle's speed, distance, elevation and acceleration times."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Tracky keeps recording your drive in the background so a run can be started before you set off and finish without touching the phone."
        INFOPLIST_KEY_NSMotionUsageDescription: "Tracky uses the accelerometer, gyroscope and barometer to measure G-force and elevation during a run."
  TrackyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TrackyTests
    dependencies:
      - target: Tracky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tracky.TrackyTests
        GENERATE_INFOPLIST_FILE: true
schemes:
  Tracky:
    build:
      targets:
        Tracky: all
    test:
      targets:
        - TrackyTests
    run:
      config: Debug
