name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Pick a simulator
        id: simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json | python3 Tools/pick_simulator.py)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Tracky.xcodeproj \
            -scheme Tracky \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Tracky.xcodeproj \
            -scheme Tracky \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore

  icon:
    name: Icon generator
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # The icon is committed, but the generator is the source of truth for it.
      # This checks the script still runs and still produces something iOS will
      # accept, without asserting byte-identical output across machines.
      - name: Regenerate the app icon
        run: python3 Tools/generate_app_icon.py

      - name: Validate the app icon
        run: python3 Tools/check_app_icon.py
